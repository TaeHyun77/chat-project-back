services:
  chat-back:
    image: ayeah77/airport-chat-project
    container_name: airport-chat-project
    networks:
      - airport-chat-net
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/airport_chat_mysql?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: chatuser
      SPRING_DATASOURCE_PASSWORD: chatpass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200

      ERROR_MONITOR_SERVER_URL: http://error-monitor-server:8090
      ERROR_MONITOR_GITHUB_REPO: TaeHyun77/chat-project-back

      JWT_SECRET: ${JWT_SECRET}
      DATA_API_KEY: ${DATA_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE}

  mysql:
    image: mysql:8.0
    container_name: airport-chat-mysql
    networks:
      - airport-chat-net
    environment:
      MYSQL_ROOT_PASSWORD: "0136"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: airport_chat_mysql
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p0136"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3307:3306"

  elasticsearch:
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    container_name: es-container
    networks:
      - airport-chat-net
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m

networks:
  airport-chat-net:
    external: true